<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BS Salada — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0f0b;
  --card: #111a13;
  --surface: #162019;
  --border: #1e2e21;
  --text: #e8f0e9;
  --muted: #5a7a5e;
  --accent: #4ade80;
  --accent2: #86efac;
  --red: #f87171;
  --orange: #fb923c;
  --yellow: #fbbf24;
  --blue: #60a5fa;
  --gdim: rgba(74,222,128,0.08);
  --rdim: rgba(248,113,113,0.08);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Mono', monospace;
  min-height: 100vh;
  padding: 20px 16px 40px;
}

/* HEADER */
.header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 28px;
}
.logo {
  font-family: 'Syne', sans-serif;
  font-size: 22px;
  font-weight: 800;
  color: var(--accent);
  letter-spacing: -0.5px;
}
.subtitle { font-size: 11px; color: var(--muted); margin-top: 2px; }
.sync-btn {
  background: var(--gdim);
  border: 1px solid var(--border);
  color: var(--accent);
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  padding: 8px 14px;
  border-radius: 20px;
  cursor: pointer;
  transition: all 0.2s;
}
.sync-btn:hover { background: var(--accent); color: var(--bg); }
.sync-btn.loading { opacity: 0.5; pointer-events: none; }

/* MOIS SELECTOR */
.mois-nav {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  margin-bottom: 20px;
  padding-bottom: 4px;
  scrollbar-width: none;
}
.mois-nav::-webkit-scrollbar { display: none; }
.mois-pill {
  flex-shrink: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--muted);
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  padding: 6px 14px;
  border-radius: 20px;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}
.mois-pill.active {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--bg);
  font-weight: 500;
}

/* KPI CARDS */
.kpi-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 16px;
}
.kpi-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px;
  position: relative;
  overflow: hidden;
}
.kpi-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--accent);
  opacity: 0.3;
}
.kpi-card.danger::before { background: var(--red); }
.kpi-card.warning::before { background: var(--orange); }
.kpi-card.info::before { background: var(--blue); }
.kpi-label {
  font-size: 9px;
  color: var(--muted);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.kpi-value {
  font-family: 'Syne', sans-serif;
  font-size: 22px;
  font-weight: 800;
  color: var(--text);
  line-height: 1;
}
.kpi-value.green { color: var(--accent); }
.kpi-value.red { color: var(--red); }
.kpi-sub {
  font-size: 10px;
  color: var(--muted);
  margin-top: 4px;
}

/* MARGE BAR */
.marge-bar-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 16px;
}
.marge-bar-title {
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 12px;
}
.bar-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}
.bar-label {
  font-size: 10px;
  color: var(--muted);
  width: 60px;
  flex-shrink: 0;
}
.bar-track {
  flex: 1;
  height: 8px;
  background: var(--surface);
  border-radius: 4px;
  overflow: hidden;
}
.bar-fill {
  height: 100%;
  border-radius: 4px;
  transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.bar-fill.ca { background: var(--accent); }
.bar-fill.achats { background: var(--orange); }
.bar-fill.charges { background: var(--red); }
.bar-fill.marge { background: var(--blue); }
.bar-amount {
  font-size: 11px;
  color: var(--text);
  width: 70px;
  text-align: right;
  flex-shrink: 0;
}

/* CHARGES SECTION */
.section-title {
  font-family: 'Syne', sans-serif;
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.charges-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 16px;
}
.charge-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
}
.charge-row:last-child { border-bottom: none; }
.charge-name { font-size: 12px; color: var(--text); }
.charge-amount { font-size: 12px; color: var(--orange); font-weight: 500; }

/* HISTORIQUE MOIS */
.histo-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 16px;
}
.histo-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 9px 0;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
}
.histo-row:last-child { border-bottom: none; }
.histo-mois { font-size: 12px; color: var(--text); }
.histo-ca { font-size: 12px; color: var(--accent); }
.histo-marge {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
}
.histo-marge.pos { background: var(--gdim); color: var(--accent); }
.histo-marge.neg { background: var(--rdim); color: var(--red); }

/* DETAIL JOUR */
.jour-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 16px;
}
.jour-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 7px 0;
  border-bottom: 1px solid var(--border);
  font-size: 11px;
}
.jour-row:last-child { border-bottom: none; }
.jour-date { color: var(--muted); }
.jour-ca { color: var(--text); }
.jour-achats { color: var(--orange); }
.jour-marge.pos { color: var(--accent); }
.jour-marge.neg { color: var(--red); }

/* LOADING */
.loader {
  text-align: center;
  padding: 3rem 0;
  color: var(--muted);
  font-size: 12px;
}
.spinner {
  width: 28px; height: 28px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.empty { text-align: center; color: var(--muted); font-size: 12px; padding: 20px 0; }
.badge { font-size: 10px; background: var(--surface); border: 1px solid var(--border); color: var(--muted); padding: 2px 8px; border-radius: 10px; }

/* VUE ANNUELLE */
.view-toggle { display:flex; gap:6px; margin-bottom:20px; }
.view-btn { flex:1; background:var(--surface); border:1px solid var(--border); color:var(--muted); font-family:'DM Mono',monospace; font-size:11px; padding:8px; border-radius:10px; cursor:pointer; transition:all 0.2s; }
.view-btn.active { background:var(--accent); border-color:var(--accent); color:var(--bg); font-weight:500; }
.chart-card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:16px; overflow:hidden; }
.chart-title { font-size:10px; color:var(--muted); letter-spacing:1px; text-transform:uppercase; margin-bottom:14px; }
.chart-legend { display:flex; gap:14px; margin-bottom:12px; flex-wrap:wrap; }
.legend-item { display:flex; align-items:center; gap:5px; font-size:10px; color:var(--muted); }
.legend-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
svg.chart { width:100%; overflow:visible; }
.kpi-annual { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
.kpi-annual-full { grid-column:1/-1; }

/* ── TENDANCES PRODUITS ──────────────────────────────────────────── */
.trend-toggles { display:flex; flex-direction:column; gap:10px; margin-bottom:14px; }
.trend-toggle-group { display:flex; flex-direction:column; gap:6px; }
.trend-toggle-label { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; }
.trend-toggle-row { display:flex; gap:6px; flex-wrap:wrap; }
.trend-btn {
  flex: 1 1 auto;
  min-width: 70px;
  background: var(--card); border: 1px solid var(--border);
  color: var(--muted); font-family:'DM Mono',monospace; font-size:10px;
  padding: 7px 10px; border-radius: 16px; cursor: pointer;
  transition: all 0.15s;
}
.trend-btn:hover { color: var(--text); border-color: var(--accent); }
.trend-btn.selected {
  background: var(--gdim); color: var(--accent); border-color: var(--accent);
}
.trend-summary {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 12px 14px; margin-bottom: 12px;
  font-size: 11px; color: var(--muted); line-height: 1.5;
}
.trend-summary strong { color: var(--text); }
.trend-summary .up { color: var(--accent); }
.trend-summary .down { color: var(--red); }
.trend-table-wrap {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; overflow: hidden;
}
.trend-table {
  width: 100%; border-collapse: collapse; font-size: 11px;
}
.trend-table thead th {
  background: var(--surface); color: var(--accent2);
  padding: 10px 8px; text-align: left; font-weight: 600;
  border-bottom: 1px solid var(--border); font-size: 10px;
  text-transform: uppercase; letter-spacing: 0.5px;
}
.trend-table thead th.num { text-align: right; }
.trend-table tbody td {
  padding: 9px 8px; border-bottom: 1px solid var(--border);
  color: var(--text);
}
.trend-table tbody tr:last-child td { border-bottom: none; }
.trend-table tbody tr:hover { background: var(--surface); }
.trend-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
.trend-evol-up { color: var(--accent); font-weight: 600; }
.trend-evol-down { color: var(--red); font-weight: 600; }
.trend-evol-flat { color: var(--muted); }
.trend-arrow { font-size: 14px; }
.trend-arrow-up { color: var(--accent); }
.trend-arrow-up-strong { color: var(--accent); font-weight: 700; }
.trend-arrow-down { color: var(--red); }
.trend-arrow-down-strong { color: var(--red); font-weight: 700; }
.trend-arrow-flat { color: var(--muted); }
.trend-arrow-new { color: var(--yellow); }
.trend-empty {
  padding: 20px; text-align: center; color: var(--muted); font-size: 11px;
}
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="logo">🥗 BS Salada</div>
    <div class="subtitle">Dashboard financier</div>
  </div>
  <button class="sync-btn" onclick="loadData()" id="sync-btn">⟳ Sync</button>
</div>

<!-- Toggle vue -->
<div class="view-toggle">
  <button class="view-btn active" id="btn-mois" onclick="setView('mois')">📅 Vue mois</button>
  <button class="view-btn" id="btn-annuel" onclick="setView('annuel')">📊 Vue annuelle</button>
</div>

<!-- Navigation mois (visible en vue mois) -->
<div class="mois-nav" id="mois-nav"></div>

<!-- KPIs -->
<div id="kpi-section">
  <div class="loader"><div class="spinner"></div>Chargement...</div>
</div>

<!-- Barre répartition -->
<div id="bar-section" style="display:none">
  <div class="marge-bar-card">
    <div class="marge-bar-title">Répartition du CA</div>
    <div class="bar-row">
      <div class="bar-label">CA</div>
      <div class="bar-track"><div class="bar-fill ca" id="bar-ca" style="width:0%"></div></div>
      <div class="bar-amount" id="bar-ca-amt"></div>
    </div>
    <div class="bar-row">
      <div class="bar-label">Achats</div>
      <div class="bar-track"><div class="bar-fill achats" id="bar-achats" style="width:0%"></div></div>
      <div class="bar-amount" id="bar-achats-amt"></div>
    </div>
    <div class="bar-row">
      <div class="bar-label">Charges</div>
      <div class="bar-track"><div class="bar-fill charges" id="bar-charges" style="width:0%"></div></div>
      <div class="bar-amount" id="bar-charges-amt"></div>
    </div>
    <div class="bar-row">
      <div class="bar-label">Marge</div>
      <div class="bar-track"><div class="bar-fill marge" id="bar-marge" style="width:0%"></div></div>
      <div class="bar-amount" id="bar-marge-amt"></div>
    </div>
  </div>
</div>

<!-- Charges détail -->
<div id="charges-section" style="display:none">
  <div class="section-title">Charges fixes <span class="badge" id="charges-mois"></span></div>
  <div class="charges-card" id="charges-list"></div>
</div>

<!-- Historique mois -->
<div id="histo-section" style="display:none">
  <div class="section-title">Historique mensuel</div>
  <div class="histo-card" id="histo-list"></div>
</div>

<!-- Détail par jour -->
<div id="jour-section" style="display:none">
  <div class="section-title">Détail par jour <span class="badge" id="jour-mois-badge"></span></div>
  <div class="jour-card" id="jour-list"></div>
</div>

<!-- ── TENDANCES PRODUITS ─────────────────────────────────────────── -->
<div id="trend-section" style="display:none">
  <div class="section-title">📈 Tendances produits</div>

  <div class="trend-toggles">
    <div class="trend-toggle-group">
      <div class="trend-toggle-label">Période</div>
      <div class="trend-toggle-row">
        <button class="trend-btn selected" data-period="week" onclick="setTrendPeriod('week')">Semaine vs S-1</button>
        <button class="trend-btn" data-period="rolling7" onclick="setTrendPeriod('rolling7')">7j vs 7j</button>
        <button class="trend-btn" data-period="month" onclick="setTrendPeriod('month')">Mois vs M-1</button>
      </div>
    </div>
    <div class="trend-toggle-group">
      <div class="trend-toggle-label">Canal</div>
      <div class="trend-toggle-row">
        <button class="trend-btn selected" data-channel="all" onclick="setTrendChannel('all')">Global</button>
        <button class="trend-btn" data-channel="boutique" onclick="setTrendChannel('boutique')">🏪 Boutique</button>
        <button class="trend-btn" data-channel="uber" onclick="setTrendChannel('uber')">🚚 Uber</button>
      </div>
    </div>
  </div>

  <div class="trend-summary" id="trend-summary"></div>
  <div class="trend-table-wrap">
    <table class="trend-table" id="trend-table">
      <thead>
        <tr>
          <th>Produit</th>
          <th class="num">Précédent</th>
          <th class="num">Actuel</th>
          <th class="num">Évol.</th>
          <th>Tendance</th>
        </tr>
      </thead>
      <tbody id="trend-tbody"></tbody>
    </table>
  </div>
</div>

<script>
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbwenbhjtHVc1ifb2_y63ZWb8_9ysSrRcgTVYLbu6tt59W85pYDQhAWMprhq2KpH4Fhg/exec';

let allData = null;
let selectedMois = null;

const MOIS_MAP = {
  'jan':'01','fev':'02','mar':'03','avr':'04','mai':'05','jun':'06',
  'jul':'07','aou':'08','sep':'09','oct':'10','nov':'11','dec':'12'
};

async function loadData() {
  const btn = document.getElementById('sync-btn');
  btn.classList.add('loading');
  btn.textContent = '⟳ Sync...';

  try {
    // Charger les 4 onglets en parallèle (saisie pour les tendances produits)
    const [margeBrute, achatsTickets, charges, saisie] = await Promise.all([
      fetchSheet('margeBrute'),
      fetchSheet('achatsTickets'),
      fetchSheet('charges'),
      fetchSheet('saisie')
    ]);

    allData = { margeBrute, achatsTickets, charges, saisie };
    buildUI();
    buildTrendSection();
  } catch(err) {
    document.getElementById('kpi-section').innerHTML =
      `<div class="empty">Erreur chargement: ${err.message}</div>`;
  }

  btn.classList.remove('loading');
  btn.textContent = '⟳ Sync';
}

async function fetchSheet(type) {
  const res = await fetch(`${SHEET_URL}?type=dashboard&sheet=${type}`, { method:'GET' });
  const data = await res.json();
  return data.rows || [];
}

function buildUI() {
  const { margeBrute, achatsTickets, charges } = allData;

  // Parser Marge Brute
  const moisData = [];
  const jourData = [];

  margeBrute.forEach(row => {
    const a = String(row[0]||'').trim().toLowerCase();
    if (!a) return;

    // Ligne mois : "Jan 2026"
    const parts = a.split(' ');
    if (parts.length === 2 && MOIS_MAP[parts[0]]) {
      const moisStr = MOIS_MAP[parts[0]] + '/' + parts[1];
      const ca      = parseFloat(row[1]) || 0;
      const achats  = parseFloat(row[2]) || 0;
      const charges = parseFloat(row[3]) || 0;
      const marge   = ca - achats - charges;
      const pct     = ca > 0 ? Math.round(marge/ca*100) : 0;
      if (ca > 0 || achats > 0) {
        moisData.push({ label: row[0], moisStr, ca, achats, charges, marge, pct });
      }
      return;
    }

    // Ligne jour : contient /
    if (String(row[0]).includes('/') && !a.includes('mois') && !a.includes('date')) {
      const ca     = parseFloat(row[1]) || 0;
      const achats = parseFloat(row[2]) || 0;
      const marge  = ca - achats;
      const pct    = ca > 0 ? Math.round(marge/ca*100) : 0;
      const dateVal = String(row[0]).trim();
      // Extraire MM/YYYY
      const dp = dateVal.split('/');
      if (dp.length >= 3) {
        const moisStr = dp[1].padStart(2,'0') + '/' + dp[2];
        jourData.push({ date: dateVal, moisStr, ca, achats, marge, pct });
      }
    }
  });

  // Mois avec données
  const moisActifs = moisData.filter(m => m.ca > 0 || m.achats > 0);
  if (!selectedMois && moisActifs.length > 0) {
    selectedMois = moisActifs[moisActifs.length - 1].moisStr;
  }

  // Nav mois
  const nav = document.getElementById('mois-nav');
  nav.innerHTML = moisActifs.map(m =>
    `<button class="mois-pill ${m.moisStr===selectedMois?'active':''}"
      onclick="selectMois('${m.moisStr}')">${m.label}</button>`
  ).join('');

  if (currentView === 'annuel') {
    renderAnnuel(moisData, charges);
  } else {
    renderMois(moisData, jourData, charges);
  }
}

function selectMois(moisStr) {
  selectedMois = moisStr;
  buildUI();
}

function renderMois(moisData, jourData, chargesRows) {
  const mois = moisData.find(m => m.moisStr === selectedMois);

  // KPIs
  const kpiEl = document.getElementById('kpi-section');
  if (!mois) {
    kpiEl.innerHTML = '<div class="empty">Aucune donnée pour ce mois</div>';
    return;
  }

  const margeClass = mois.marge >= 0 ? 'green' : 'red';
  const pctClass   = mois.pct >= 0 ? 'green' : 'red';

  kpiEl.innerHTML = `
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label">CA Ventes</div>
        <div class="kpi-value green">${fmt(mois.ca)}</div>
        <div class="kpi-sub">Ce mois</div>
      </div>
      <div class="kpi-card ${mois.marge>=0?'':'danger'}">
        <div class="kpi-label">Marge Brute</div>
        <div class="kpi-value ${margeClass}">${fmt(mois.marge)}</div>
        <div class="kpi-sub">${mois.pct}% du CA</div>
      </div>
      <div class="kpi-card warning">
        <div class="kpi-label">Coût Achats</div>
        <div class="kpi-value">${fmt(mois.achats)}</div>
        <div class="kpi-sub">${mois.ca>0?Math.round(mois.achats/mois.ca*100):0}% du CA</div>
      </div>
      <div class="kpi-card info">
        <div class="kpi-label">Charges Fixes</div>
        <div class="kpi-value">${fmt(mois.charges)}</div>
        <div class="kpi-sub">Loyer, élec, eau...</div>
      </div>
    </div>`;

  // Barres
  document.getElementById('bar-section').style.display = 'block';
  const maxVal = Math.max(mois.ca, 1);
  setTimeout(() => {
    document.getElementById('bar-ca').style.width     = '100%';
    document.getElementById('bar-achats').style.width = Math.min(100, mois.achats/maxVal*100) + '%';
    document.getElementById('bar-charges').style.width= Math.min(100, mois.charges/maxVal*100) + '%';
    document.getElementById('bar-marge').style.width  = Math.max(0, Math.min(100, mois.marge/maxVal*100)) + '%';
  }, 100);
  document.getElementById('bar-ca-amt').textContent     = fmt(mois.ca);
  document.getElementById('bar-achats-amt').textContent = fmt(mois.achats);
  document.getElementById('bar-charges-amt').textContent= fmt(mois.charges);
  document.getElementById('bar-marge-amt').textContent  = fmt(mois.marge);

  // Charges détail
  const chargesMois = chargesRows.filter(r => String(r[0]).trim() === selectedMois);
  const chargesEl = document.getElementById('charges-section');
  document.getElementById('charges-mois').textContent = selectedMois;
  if (chargesMois.length > 0) {
    chargesEl.style.display = 'block';
    document.getElementById('charges-list').innerHTML = chargesMois.map(r =>
      `<div class="charge-row">
        <span class="charge-name">${r[1]||'—'}</span>
        <span class="charge-amount">${fmt(parseFloat(r[2])||0)}</span>
      </div>`
    ).join('');
  } else {
    chargesEl.style.display = 'none';
  }

  // Historique mois
  const histoEl = document.getElementById('histo-section');
  histoEl.style.display = 'block';
  const moisActifs = moisData.filter(m => m.ca > 0 || m.achats > 0).reverse();
  document.getElementById('histo-list').innerHTML = moisActifs.length ? moisActifs.map(m =>
    `<div class="histo-row" onclick="selectMois('${m.moisStr}')">
      <span class="histo-mois">${m.label}</span>
      <span class="histo-ca">${fmt(m.ca)}</span>
      <span class="histo-marge ${m.marge>=0?'pos':'neg'}">${m.pct}%</span>
    </div>`
  ).join('') : '<div class="empty">Aucun historique</div>';

  // Détail par jour
  const joursFiltered = jourData
    .filter(j => j.moisStr === selectedMois && (j.ca > 0 || j.achats > 0))
    .sort((a,b) => {
      const [da,ma,ya] = a.date.split('/').map(Number);
      const [db,mb,yb] = b.date.split('/').map(Number);
      return new Date(yb,mb-1,db) - new Date(ya,ma-1,da);
    });

  const jourEl = document.getElementById('jour-section');
  document.getElementById('jour-mois-badge').textContent = selectedMois;
  jourEl.style.display = 'block';
  document.getElementById('jour-list').innerHTML = joursFiltered.length ? joursFiltered.map(j =>
    `<div class="jour-row">
      <span class="jour-date">${j.date}</span>
      <span class="jour-ca">${fmt(j.ca)}</span>
      <span class="jour-achats">-${fmt(j.achats)}</span>
      <span class="jour-marge ${j.marge>=0?'pos':'neg'}">${fmt(j.marge)}</span>
    </div>`
  ).join('') : '<div class="empty">Aucune vente ce mois</div>';
}

function fmt(n) {
  if (isNaN(n)) return '0,00 €';
  return n.toFixed(2).replace('.', ',') + ' €';
}

// ── VUE ANNUELLE ─────────────────────────────────────────────────────────────
let currentView = 'mois';

function setView(v) {
  currentView = v;
  document.getElementById('btn-mois').classList.toggle('active', v==='mois');
  document.getElementById('btn-annuel').classList.toggle('active', v==='annuel');
  document.getElementById('mois-nav').style.display = v==='mois' ? 'flex' : 'none';
  if (allData) buildUI();
}

function renderAnnuel(moisData, chargesRows) {
  const kpiEl = document.getElementById('kpi-section');
  const moisActifs = moisData.filter(m => m.ca > 0 || m.achats > 0);

  // Totaux annuels
  const totalCA      = moisActifs.reduce((s,m) => s+m.ca, 0);
  const totalAchats  = moisActifs.reduce((s,m) => s+m.achats, 0);
  const totalCharges = moisActifs.reduce((s,m) => s+m.charges, 0);

  const totalPct     = totalCA > 0 ? Math.round(totalMarge/totalCA*100) : 0;

  kpiEl.innerHTML = `
    <div class="kpi-annual">
      <div class="kpi-card kpi-annual-full">
        <div class="kpi-label">CA Annuel Total</div>
        <div class="kpi-value green" style="font-size:28px">${fmt(totalCA)}</div>
        <div class="kpi-sub">${moisActifs.length} mois d'activité</div>
      </div>
      <div class="kpi-card ${totalMarge>=0?'':'danger'}">
        <div class="kpi-label">Marge Brute</div>
        <div class="kpi-value ${totalMarge>=0?'green':'red'}">${fmt(totalMarge)}</div>
        <div class="kpi-sub">${totalPct}% du CA</div>
      </div>
      <div class="kpi-card warning">
        <div class="kpi-label">Coût Achats</div>
        <div class="kpi-value">${fmt(totalAchats)}</div>
        <div class="kpi-sub">${totalCA>0?Math.round(totalAchats/totalCA*100):0}% du CA</div>
      </div>
      <div class="kpi-card info">
        <div class="kpi-label">Charges Fixes</div>
        <div class="kpi-value">${fmt(totalCharges)}</div>
        <div class="kpi-sub">Toute l'année</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Meilleur mois CA</div>
        <div class="kpi-value" style="font-size:16px">${moisActifs.length ? moisActifs.reduce((a,b)=>a.ca>b.ca?a:b).label : '—'}</div>
        <div class="kpi-sub">${moisActifs.length ? fmt(Math.max(...moisActifs.map(m=>m.ca))) : '—'}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Meilleure marge</div>
        <div class="kpi-value green" style="font-size:16px">${moisActifs.length ? moisActifs.reduce((a,b)=>a.pct>b.pct?a:b).label : '—'}</div>
        <div class="kpi-sub">${moisActifs.length ? Math.max(...moisActifs.map(m=>m.pct)) + '%' : '—'}</div>
      </div>

  // Graphique en lignes SVG
  document.getElementById('bar-section').style.display = 'none';
  document.getElementById('charges-section').style.display = 'none';
  document.getElementById('jour-section').style.display = 'none';

  const histoEl = document.getElementById('histo-section');

  // Injecter graphique avant l'historique

    chartEl = document.createElement('div');
    chartEl.id = 'annual-chart';

  if (moisActifs.length > 0) {

  // Tableau récap par mois

      <span style="flex:1;text-align:right">Achats</span>
      <span style="flex:1;text-align:right">Charges</span>
      <span style="flex:1;text-align:right">Marge</span>
      <span style="width:45px;text-align:right">%</span>
    </div>
    ${moisActifs.map(m => `
    <div class="jour-row" onclick="selectMoisFromAnnuel('${m.moisStr}')">
      <span class="jour-date" style="width:70px">${m.label}</span>

      <span class="jour-achats" style="flex:1;text-align:right">${fmt(m.achats)}</span>
      <span style="flex:1;text-align:right;color:var(--red);font-size:11px">${fmt(m.charges)}</span>
      <span class="jour-marge ${m.marge>=0?'pos':'neg'}" style="flex:1;text-align:right">${fmt(m.marge)}</span>

    </div>`).join('')}`;
}

function selectMoisFromAnnuel(moisStr) {
  selectedMois = moisStr;
  setView('mois');
}

function buildLineChart(moisData) {
  const W = 320, H = 140, PAD = { t:10, r:10, b:30, l:50 };
  const cw = W - PAD.l - PAD.r;
  const ch = H - PAD.t - PAD.b;
  const n = moisData.length;

  const allVals = moisData.flatMap(m => [m.ca, m.achats+m.charges, m.marge]);
  const maxV = Math.max(...allVals, 1);
  const minV = Math.min(...allVals, 0);
  const range = maxV - minV || 1;

  const xPos = i => PAD.l + (n===1 ? cw/2 : i/(n-1)*cw);
  const yPos = v => PAD.t + ch - ((v-minV)/range)*ch;

  const line = (arr, key) => arr.map((m,i) => `${i===0?'M':'L'}${xPos(i).toFixed(1)},${yPos(m[key]).toFixed(1)}`).join(' ');
  const area = (arr, key) => `${line(arr,key)} L${xPos(n-1).toFixed(1)},${(PAD.t+ch).toFixed(1)} L${PAD.l.toFixed(1)},${(PAD.t+ch).toFixed(1)} Z`;

  // Grille Y (3 lignes)
  const gridLines = [0, 0.5, 1].map(t => {
    const v = minV + t*range;
    const y = yPos(v);
    const label = v >= 1000 ? (v/1000).toFixed(1)+'k' : v.toFixed(0);
    return `<line x1="${PAD.l}" y1="${y.toFixed(1)}" x2="${W-PAD.r}" y2="${y.toFixed(1)}" stroke="#1e2e21" stroke-width="1"/>
            <text x="${(PAD.l-4).toFixed(1)}" y="${y.toFixed(1)}" text-anchor="end" dominant-baseline="middle" fill="#5a7a5e" font-size="8">${label}</text>`;
  }).join('');

  // Labels X
  const xLabels = moisData.map((m,i) => {
    const shortLabel = m.label.split(' ')[0].slice(0,3);
    return `<text x="${xPos(i).toFixed(1)}" y="${(H-PAD.b+14).toFixed(1)}" text-anchor="middle" fill="#5a7a5e" font-size="8">${shortLabel}</text>`;
  }).join('');

  // Points interactifs
  const dots = (key, color) => moisData.map((m,i) =>
    `<circle cx="${xPos(i).toFixed(1)}" cy="${yPos(m[key]).toFixed(1)}" r="3" fill="${color}" stroke="var(--bg)" stroke-width="1.5">
       <title>${m.label}: ${fmt(m[key])}</title>
     </circle>`
  ).join('');

  const coûtTotal = m => m.achats + m.charges;

  return `<div class="chart-card">
    <div class="chart-title">Évolution annuelle</div>
    <div class="chart-legend">
      <div class="legend-item"><div class="legend-dot" style="background:#4ade80"></div>CA</div>
      <div class="legend-item"><div class="legend-dot" style="background:#fb923c"></div>Coûts</div>
      <div class="legend-item"><div class="legend-dot" style="background:#60a5fa"></div>Marge</div>
    </div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="DM Mono, monospace">
      ${gridLines}
      ${xLabels}
      <!-- Zone marge -->
      <path d="${area(moisData,'marge')}" fill="rgba(96,165,250,0.06)" stroke="none"/>
      <!-- Lignes -->
      <path d="${line(moisData,'ca')}" fill="none" stroke="#4ade80" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="${moisData.map((m,i)=>`${i===0?'M':'L'}${xPos(i).toFixed(1)},${yPos(coûtTotal(m)).toFixed(1)}`).join(' ')}" fill="none" stroke="#fb923c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4,2"/>
      <path d="${line(moisData,'marge')}" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <!-- Points -->
      ${dots('ca','#4ade80')}
      ${moisData.map((m,i)=>`<circle cx="${xPos(i).toFixed(1)}" cy="${yPos(coûtTotal(m)).toFixed(1)}" r="3" fill="#fb923c" stroke="var(--bg)" stroke-width="1.5"><title>${m.label} Coûts: ${fmt(coûtTotal(m))}</title></circle>`).join('')}
      ${dots('marge','#60a5fa')}
    </svg>
  </div>`;
}

// ════════════════════════════════════════════════════════════════════
// ── TENDANCES PRODUITS ──────────────────────────────────────────────
// ════════════════════════════════════════════════════════════════════
let trendPeriod = 'week';     // 'week' | 'rolling7' | 'month'
let trendChannel = 'all';     // 'all' | 'boutique' | 'uber'

// Parse une date "JJ/MM/YYYY" en objet Date (à midi pour éviter pbs TZ)
function parseSaisieDate(s) {
  if (!s) return null;
  const parts = String(s).trim().split('/');
  if (parts.length !== 3) return null;
  const d = parseInt(parts[0]), m = parseInt(parts[1]), y = parseInt(parts[2]);
  if (isNaN(d) || isNaN(m) || isNaN(y)) return null;
  return new Date(y, m-1, d, 12, 0, 0);
}

// Calcule les bornes [debutCourant, finCourant, debutPrec, finPrec]
// selon la période et la date du jour
function getTrendBounds(period, ref) {
  const now = ref || new Date();
  const y = now.getFullYear(), m = now.getMonth(), d = now.getDate();
  const today = new Date(y, m, d, 12, 0, 0);

  if (period === 'rolling7') {
    // 7 derniers jours (jour J-6 inclus à J inclus) vs J-13 à J-7
    const finC = today;
    const debC = new Date(y, m, d - 6, 12, 0, 0);
    const finP = new Date(y, m, d - 7, 12, 0, 0);
    const debP = new Date(y, m, d - 13, 12, 0, 0);
    return { debC, finC, debP, finP, labelC: '7 derniers jours', labelP: '7 jours précédents' };
  }

  if (period === 'week') {
    // Semaine ISO en cours (lundi → dimanche)
    const jourDeLaSemaine = today.getDay(); // 0=dim, 1=lun, ..., 6=sam
    const decalLundi = (jourDeLaSemaine === 0 ? 6 : jourDeLaSemaine - 1);
    const debC = new Date(y, m, d - decalLundi, 12, 0, 0);
    const finC = new Date(y, m, d - decalLundi + 6, 12, 0, 0);
    const debP = new Date(y, m, d - decalLundi - 7, 12, 0, 0);
    const finP = new Date(y, m, d - decalLundi - 1, 12, 0, 0);
    return { debC, finC, debP, finP, labelC: 'Semaine en cours', labelP: 'Semaine précédente' };
  }

  if (period === 'month') {
    // Mois calendaire en cours vs mois précédent
    const debC = new Date(y, m, 1, 12, 0, 0);
    const finC = new Date(y, m + 1, 0, 12, 0, 0);
    const debP = new Date(y, m - 1, 1, 12, 0, 0);
    const finP = new Date(y, m, 0, 12, 0, 0);
    return { debC, finC, debP, finP, labelC: 'Mois en cours', labelP: 'Mois précédent' };
  }

  return null;
}

// Strip le suffixe " Uber" pour la vue Global
function stripUberSuffix(name) {
  return name.replace(/\s+Uber\s*$/i, '').trim();
}

// Détecte si une ligne est Uber (par lieu OU par suffixe nom — sécurité)
function isUberRow(row) {
  const lieu = String(row[4] || '').trim().toLowerCase();
  const produit = String(row[1] || '');
  return lieu === 'uber' || /\s+Uber\s*$/i.test(produit);
}

// Filtre les ventes selon le canal
function filterByChannel(rows, channel) {
  if (channel === 'all') return rows;
  if (channel === 'uber') return rows.filter(r => isUberRow(r));
  if (channel === 'boutique') return rows.filter(r => !isUberRow(r));
  return rows;
}

// Agrège les ventes par produit sur une plage de dates
// channel 'all' → strip du suffixe " Uber" pour regrouper avec la version boutique
function aggregateByProduct(rows, debut, fin, channel) {
  const agg = {};
  rows.forEach(row => {
    const d = parseSaisieDate(row[0]);
    if (!d) return;
    if (d < debut || d > fin) return;
    let produit = String(row[1] || '').trim();
    if (!produit) return;
    const qty = parseInt(row[3]) || 0;
    const prix = parseFloat(row[2]) || 0;
    if (qty <= 0) return;

    // En vue Global, on strip le suffixe " Uber" pour regrouper
    if (channel === 'all') produit = stripUberSuffix(produit);

    if (!agg[produit]) agg[produit] = { qty: 0, ca: 0 };
    agg[produit].qty += qty;
    agg[produit].ca += prix * qty;
  });
  return agg;
}

// Construit la liste des produits avec leur évolution
function buildTrendList(rows, period, channel) {
  const bounds = getTrendBounds(period);
  if (!bounds) return { lines: [], totalC: 0, totalP: 0, bounds: null };

  const filtered = filterByChannel(rows, channel);
  const aggC = aggregateByProduct(filtered, bounds.debC, bounds.finC, channel);
  const aggP = aggregateByProduct(filtered, bounds.debP, bounds.finP, channel);

  // Union de tous les produits ayant été vendus dans une ou l'autre période
  const tousLesProduits = new Set([...Object.keys(aggC), ...Object.keys(aggP)]);

  const lines = [];
  let totalC = 0, totalP = 0;

  tousLesProduits.forEach(produit => {
    const c = aggC[produit] || { qty: 0, ca: 0 };
    const p = aggP[produit] || { qty: 0, ca: 0 };
    totalC += c.qty;
    totalP += p.qty;

    let evolPct = null;
    let evolLabel = '—';
    let arrow = '';
    let arrowClass = 'trend-arrow-flat';
    let evolClass = 'trend-evol-flat';

    if (p.qty === 0 && c.qty > 0) {
      evolLabel = 'Nouveau';
      arrow = '🆕';
      arrowClass = 'trend-arrow-new';
      evolClass = 'trend-evol-up';
      evolPct = Infinity;
    } else if (p.qty > 0 && c.qty === 0) {
      evolLabel = '-100%';
      arrow = '↓↓';
      arrowClass = 'trend-arrow-down-strong';
      evolClass = 'trend-evol-down';
      evolPct = -100;
    } else if (p.qty > 0) {
      evolPct = Math.round((c.qty - p.qty) / p.qty * 1000) / 10;
      evolLabel = (evolPct >= 0 ? '+' : '') + evolPct + '%';
      if (evolPct >= 50)       { arrow = '↗↗'; arrowClass = 'trend-arrow-up-strong'; evolClass = 'trend-evol-up'; }
      else if (evolPct >= 10)  { arrow = '↗';  arrowClass = 'trend-arrow-up';        evolClass = 'trend-evol-up'; }
      else if (evolPct >  -10) { arrow = '→';  arrowClass = 'trend-arrow-flat';      evolClass = 'trend-evol-flat'; }
      else if (evolPct >  -50) { arrow = '↘';  arrowClass = 'trend-arrow-down';      evolClass = 'trend-evol-down'; }
      else                     { arrow = '↘↘'; arrowClass = 'trend-arrow-down-strong'; evolClass = 'trend-evol-down'; }
    } else {
      // p.qty = 0 et c.qty = 0 → ignorer (produit nulle part)
      return;
    }

    lines.push({
      produit, qtyP: p.qty, qtyC: c.qty,
      evolPct, evolLabel, arrow, arrowClass, evolClass,
    });
  });

  // Tri : nouveaux d'abord (Infinity), puis par évolution décroissante
  lines.sort((a, b) => {
    if (a.evolPct === Infinity && b.evolPct !== Infinity) return -1;
    if (b.evolPct === Infinity && a.evolPct !== Infinity) return 1;
    return (b.evolPct || 0) - (a.evolPct || 0);
  });

  return { lines, totalC, totalP, bounds };
}

function setTrendPeriod(p) {
  trendPeriod = p;
  document.querySelectorAll('.trend-btn[data-period]').forEach(b => {
    b.classList.toggle('selected', b.dataset.period === p);
  });
  renderTrend();
}

function setTrendChannel(c) {
  trendChannel = c;
  document.querySelectorAll('.trend-btn[data-channel]').forEach(b => {
    b.classList.toggle('selected', b.dataset.channel === c);
  });
  renderTrend();
}

function buildTrendSection() {
  if (!allData || !allData.saisie) return;
  document.getElementById('trend-section').style.display = 'block';
  renderTrend();
}

function renderTrend() {
  if (!allData || !allData.saisie) return;
  const rows = allData.saisie;
  const { lines, totalC, totalP, bounds } = buildTrendList(rows, trendPeriod, trendChannel);

  // Résumé global
  const summaryEl = document.getElementById('trend-summary');
  if (!bounds) {
    summaryEl.innerHTML = '<div class="trend-empty">Pas de période sélectionnée.</div>';
    document.getElementById('trend-tbody').innerHTML = '';
    return;
  }
  let evolTotal = '—';
  let evolClass = '';
  if (totalP > 0) {
    const pct = Math.round((totalC - totalP) / totalP * 1000) / 10;
    evolTotal = (pct >= 0 ? '+' : '') + pct + '%';
    evolClass = pct >= 0 ? 'up' : 'down';
  } else if (totalC > 0) {
    evolTotal = 'Nouveau';
    evolClass = 'up';
  }

  const fmtDate = d => String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0');
  const canalLabel = trendChannel === 'all' ? 'tous canaux (Uber regroupé avec boutique)' :
                     trendChannel === 'uber' ? '🚚 Uber uniquement' :
                     '🏪 Boutique uniquement';

  summaryEl.innerHTML = `
    <div><strong>${bounds.labelC}</strong> (${fmtDate(bounds.debC)} → ${fmtDate(bounds.finC)})
    vs <strong>${bounds.labelP}</strong> (${fmtDate(bounds.debP)} → ${fmtDate(bounds.finP)})</div>
    <div style="margin-top:6px">Total unités vendues : <strong>${totalC}</strong> vs ${totalP}
    → <span class="${evolClass}"><strong>${evolTotal}</strong></span></div>
    <div style="margin-top:4px;font-size:10px">Canal : ${canalLabel}</div>
  `;

  // Tableau
  const tbody = document.getElementById('trend-tbody');
  if (lines.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" class="trend-empty">Aucune vente sur ces deux périodes.</td></tr>';
    return;
  }

  tbody.innerHTML = lines.map(l => `
    <tr>
      <td>${l.produit}</td>
      <td class="num">${l.qtyP}</td>
      <td class="num"><strong>${l.qtyC}</strong></td>
      <td class="num ${l.evolClass}">${l.evolLabel}</td>
      <td><span class="trend-arrow ${l.arrowClass}">${l.arrow}</span></td>
    </tr>
  `).join('');
}

// Charger au démarrage
loadData();
</script>
